name: Update content & Release

on:
  schedule:
    # 每天北京时间 06:30（UTC 22:30）
    - cron: '30 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest content
        run: ./scripts/fetch-content.sh

      - name: Check for content changes
        id: diff
        run: |
          if git diff --quiet app/src/main/assets/index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated content
        # push 触发时只构建验证，不提交；内容变化或手动触发时才提交
        if: github.event_name != 'push' && (steps.diff.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/index.html
          git diff --cached --quiet || git commit -m "chore: update book content [skip ci]"
          git push

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore and write local.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          cat > local.properties <<EOF
          KEYSTORE_FILE=$RUNNER_TEMP/upload.keystore
          KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD
          KEY_ALIAS=$KEY_ALIAS
          KEY_PASSWORD=$KEY_PASSWORD
          EOF

      - name: Compute version
        id: version
        run: |
          VERSION_NAME=$(date +%Y.%m.%d)
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: >-
          ./gradlew assembleRelease
          -PversionCode=${{ steps.version.outputs.version_code }}
          -PversionName=${{ steps.version.outputs.version_name }}

      - name: Create Release
        # push 触发只做构建验证，不发 Release
        if: github.event_name != 'push' && (steps.diff.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: v${{ steps.version.outputs.version_name }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
