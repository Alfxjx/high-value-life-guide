name: Update content & Release

on:
  schedule:
    # 每天北京时间 06:30（UTC 22:30）
    - cron: '30 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest content
        run: ./scripts/fetch-content.sh

      - name: Parse content into structured JSON
        # 构建期把 index.html 解析成 content.json（只用 Python 3 标准库）
        run: python3 scripts/parse_content.py

      - name: Check for content changes
        id: diff
        # 解析结果也算内容：index.html 或 content.json 任一变化都视为有更新
        run: |
          if [ -z "$(git status --porcelain -- app/src/main/assets/index.html app/src/main/assets/content.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated content
        # push 触发时只构建验证，不提交；内容变化或手动触发时才提交
        if: github.event_name != 'push' && (steps.diff.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/index.html app/src/main/assets/content.json
          git diff --cached --quiet || git commit -m "chore: update book content [skip ci]"
          git push

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        # ubuntu-latest 预装 Android SDK（sdkmanager 在 PATH 里）；接受协议并确保所需组件在位
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Decode keystore and write local.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          cat > local.properties <<EOF
          KEYSTORE_FILE=$RUNNER_TEMP/upload.keystore
          KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD
          KEY_ALIAS=$KEY_ALIAS
          KEY_PASSWORD=$KEY_PASSWORD
          EOF

      - name: Compute version
        id: version
        # 与 app/build.gradle.kts 的本地规则一致：分钟级时间戳，单调递增
        run: |
          VERSION_NAME="2.0.$(TZ=Asia/Shanghai date +%Y%m%d.%H%M)"
          VERSION_CODE=$(( $(date +%s) / 60 - 29453760 ))
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: >-
          ./gradlew assembleRelease
          -PversionCode=${{ steps.version.outputs.version_code }}
          -PversionName=${{ steps.version.outputs.version_name }}

      - name: Create Release
        # push 触发只做构建验证，不发 Release
        if: github.event_name != 'push' && (steps.diff.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: v${{ steps.version.outputs.version_name }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
